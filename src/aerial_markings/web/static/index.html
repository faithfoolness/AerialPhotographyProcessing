<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerial Road Markings</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<style>
  :root {
    --bg: #f9f7f7; --panel: #ffffff; --ink: #3f4a4b; --muted: #7b8b8c;
    --accent: #6b8c8d; --btn: #88b2cc; --btn-hover: #76a1bb; --line: #dfe7ec;
    --soft: #f0f4f8; --ok: #e0ebe5; --err: #f8e8e8; --err-ink: #b55b5b;
    --solid: #ff4d4f; --dashed: #ffc53d; --dash: #40a9ff; --veh: #b37feb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
         color: var(--ink); background: var(--bg); }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 20px;
          overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 18px; color: var(--accent); }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .drop { border: 2px dashed #c3cfe2; border-radius: 12px; background: var(--soft);
          padding: 22px 14px; text-align: center; cursor: pointer; transition: .2s; }
  .drop.over { background: #e6e9f0; border-color: #a8b6d1; }
  .drop.ready { background: var(--ok); border-color: #a8c3b9; }
  .drop b { color: var(--accent); }
  .files { margin-top: 10px; font-size: 12px; color: var(--muted); text-align: left; }
  .files div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; word-break: break-all; }
  .files .warn { color: var(--err-ink); }
  .clear { font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; background: none;
           padding: 0; font-weight: 400; margin-top: 6px; }
  .clear:hover { background: none; color: var(--ink); }
  #perImage td { padding: 4px 0; vertical-align: top; border-top: 1px solid var(--line); }
  #perImage td:first-child { word-break: break-all; padding-right: 8px; }
  #perImage a { color: var(--accent); }
  label.field { display: block; font-size: 12px; color: var(--muted); }
  input[type=text] { width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid var(--line);
                     border-radius: 6px; font: inherit; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
  button, .btn { appearance: none; border: 0; border-radius: 6px; padding: 10px 14px; cursor: pointer;
           background: var(--btn); color: #fff; font: inherit; font-weight: 600; text-decoration: none;
           text-align: center; transition: background .2s; }
  button:hover, .btn:hover { background: var(--btn-hover); }
  button:disabled { background: #c9d3d8; cursor: default; }
  .progress { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--btn); transition: width .3s; }
  .status { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .error { background: var(--err); color: var(--err-ink); padding: 10px; border-radius: 6px; font-size: 13px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 3px 0; } td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .sw { display: inline-block; width: 18px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .downloads { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .downloads .btn { padding: 8px; font-size: 13px; background: #d4e3e3; color: var(--ink); font-weight: 500; }
  .downloads .btn:hover { background: #c3d9e8; }
  .meta { font-size: 12px; color: var(--muted); }
  #map { height: 100%; }
  .hidden { display: none !important; }
  .layers label { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 3px 0; }
  input[type=range] { width: 100%; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 70vh; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div>
      <h1>Aerial Road Markings</h1>
      <p class="sub">GeoTIFF orthophoto → vector road markings</p>
    </div>

    <form id="form">
      <div class="drop" id="drop">
        <div><b>Drop one or more .tif</b> (with .tfw / .prj if they have them)</div>
        <div class="sub">or click to choose files</div>
        <div class="files" id="fileList"></div>
        <input type="file" id="fileInput" multiple accept=".tif,.tiff,.tfw,.tifw,.prj" hidden>
      </div>
      <button type="button" class="clear hidden" id="clearBtn">Clear selection</button>
      <div style="height:12px"></div>
      <label class="field">CRS, only for images that have none
        <input type="text" id="crs" placeholder="e.g. EPSG:32637">
      </label>
      <div style="height:10px"></div>
      <label class="check"><input type="checkbox" id="vehicles" checked> Exclude vehicles (YOLO-OBB)</label>
      <div style="height:14px"></div>
      <button type="submit" id="go" disabled style="width:100%">Extract markings</button>
    </form>

    <div id="progressBox" class="hidden">
      <div class="progress"><div id="bar"></div></div>
      <div class="status" id="status"></div>
    </div>
    <div id="errorBox" class="error hidden"></div>

    <div id="results" class="hidden">
      <div class="card">
        <h2>Result</h2>
        <table id="summary"></table>
        <div class="meta" id="meta" style="margin-top:8px"></div>
      </div>
      <div style="height:12px"></div>
      <div class="card" id="perImageCard">
        <h2>Images</h2>
        <table id="perImage"></table>
      </div>
      <div style="height:12px"></div>
      <div class="card layers">
        <h2>Layers</h2>
        <label><input type="checkbox" data-layer="solid" checked><span class="sw" style="background:var(--solid)"></span>Solid</label>
        <label><input type="checkbox" data-layer="dashed" checked><span class="sw" style="background:var(--dashed)"></span>Dashed</label>
        <label id="dashLayer"><input type="checkbox" data-layer="dash" checked><span class="sw" style="background:var(--dash)"></span>Single strokes</label>
        <label><input type="checkbox" id="photoToggle" checked> Uploaded images</label>
        <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.9" aria-label="Image opacity">
      </div>
      <div style="height:12px"></div>
      <div class="downloads" id="downloads"></div>
    </div>
  </aside>
  <div id="map"></div>
</div>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script>
const COLORS = { solid: '#ff4d4f', dashed: '#ffc53d', dash: '#40a9ff' };
const LABELS = { solid: 'Solid', dashed: 'Dashed', dash: 'Single strokes' };

const map = L.map('map', { zoomControl: true }).setView([55.75, 37.62], 5);
const imagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 22, maxNativeZoom: 19, attribution: 'Imagery © Esri' }).addTo(map);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 22, maxNativeZoom: 19, attribution: '© OpenStreetMap contributors' });
L.control.layers({ 'Satellite': imagery, 'OpenStreetMap': osm }, null, { position: 'topright' }).addTo(map);

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let files = new Map(), photos = L.layerGroup(), typeLayers = {};

const stem = n => n.replace(/\.[^.]+$/, '').toLowerCase();
const isTif = n => /\.tiff?$/i.test(n);

function pick(list) {
  for (const f of list) if (/\.(tif|tiff|tfw|tifw|prj)$/i.test(f.name)) files.set(f.name, f);
  render();
}
function render() {
  const all = [...files.values()];
  const tifs = all.filter(f => isTif(f.name));
  const side = all.filter(f => !isTif(f.name));
  const rows = tifs.map(t => {
    const mine = side.filter(c => stem(c.name) === stem(t.name) || tifs.length === 1);
    const geo = mine.some(c => /\.(tfw|tifw)$/i.test(c.name)) ? '+ tfw' : '';
    const prj = mine.some(c => /\.prj$/i.test(c.name)) ? '+ prj' : '';
    return `<div><span>${esc(t.name)}</span><span>${[geo, prj].filter(Boolean).join(' ')}</span></div>`;
  });
  const orphans = tifs.length > 1 ? side.filter(c => !tifs.some(t => stem(t.name) === stem(c.name))) : [];
  if (orphans.length) rows.push(`<div class="warn">No image for: ${orphans.map(o => esc(o.name)).join(', ')}</div>`);
  $('fileList').innerHTML = rows.join('');
  $('drop').classList.toggle('ready', tifs.length > 0);
  $('go').disabled = tifs.length === 0;
  $('go').textContent = tifs.length > 1 ? `Extract markings from ${tifs.length} images` : 'Extract markings';
  $('clearBtn').classList.toggle('hidden', all.length === 0);
}
$('drop').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { pick(e.target.files); e.target.value = ''; };
$('clearBtn').onclick = () => { files.clear(); render(); };
['dragenter', 'dragover'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => pick(e.dataTransfer.files));

$('form').onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData();
  files.forEach(f => fd.append('files', f));
  fd.append('crs', $('crs').value);
  fd.append('vehicles', $('vehicles').checked);
  $('go').disabled = true;
  $('errorBox').classList.add('hidden');
  $('results').classList.add('hidden');
  $('progressBox').classList.remove('hidden');
  setProgress(0, 'Uploading…');
  try {
    const r = await fetch('/api/jobs', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Upload failed');
    poll(data.id);
  } catch (err) { fail(err.message); }
};

function setProgress(f, msg) { $('bar').style.width = (f * 100) + '%'; $('status').textContent = msg; }
function fail(msg) {
  $('progressBox').classList.add('hidden');
  $('errorBox').textContent = msg; $('errorBox').classList.remove('hidden');
  $('go').disabled = false;
}

async function poll(id) {
  const r = await fetch(`/api/jobs/${id}`);
  const job = await r.json();
  if (job.status === 'error') return fail(job.error);
  const n = job.images.length;
  const prefix = n > 1 ? `Image ${Math.min(job.current + 1, n)} of ${n} · ` : '';
  setProgress(job.progress, job.status === 'done' ? job.message : prefix + job.message);
  if (job.status !== 'done') return setTimeout(() => poll(id), 700);
  $('go').disabled = false;
  show(id, job);
}

async function show(id, job) {
  const url = name => `/api/jobs/${id}/files/` + name.split('/').map(encodeURIComponent).join('/');
  const done = job.images.filter(im => im.status === 'done');
  const [geo, ...prevs] = await Promise.all([
    fetch(url(job.files.geojson)).then(r => r.json()),
    ...done.map(im => fetch(url(im.files.preview_bounds)).then(r => r.json())),
  ]);

  photos.clearLayers();
  Object.values(typeLayers).forEach(l => map.removeLayer(l));
  let bounds = null;
  done.forEach((im, i) => {
    photos.addLayer(L.imageOverlay(url(im.files.preview), prevs[i].bounds, { opacity: +$('opacity').value }));
    const b = L.latLngBounds(prevs[i].bounds);
    bounds = bounds ? bounds.extend(b) : b;
  });
  photos.addTo(map);
  typeLayers = {};
  for (const t of Object.keys(COLORS)) {
    typeLayers[t] = L.geoJSON(geo, {
      filter: f => f.properties.type === t,
      style: { color: COLORS[t], weight: t === 'dash' ? 3 : 2.5, opacity: .95 },
      onEachFeature: (f, l) => l.bindPopup(
        `<b>${LABELS[f.properties.type]}</b>, ${esc(f.properties.color)}<br>Length: ${f.properties.length_m} m` +
        `<br>Pieces: ${f.properties.pieces}<br>Width ≈ ${f.properties.width_m} m<br>Image: ${esc(f.properties.image)}`)
    }).addTo(map);
  }
  document.querySelectorAll('[data-layer]').forEach(cb => cb.checked = true);
  $('photoToggle').checked = true;
  if (bounds) map.fitBounds(bounds);

  const s = job.stats;
  $('summary').innerHTML = Object.keys(COLORS).filter(t => t !== 'dash' || s.by_type.dash).map(t => {
    const v = s.by_type[t] || { count: 0, length_m: 0 };
    return `<tr><td><span class="sw" style="background:${COLORS[t]}"></span>${LABELS[t]}</td>` +
           `<td class="num">${v.count}</td><td class="num">${v.length_m.toLocaleString()} m</td></tr>`;
  }).join('');
  const one = done.length === 1 ? done[0].stats : null;
  $('meta').innerHTML = (one
    ? `${one.size_px[0]}×${one.size_px[1]} px · ${(one.gsd_m * 100).toFixed(1)} cm/px · ${esc(one.crs)}<br>` +
      `Vehicles excluded: ${one.vehicles} · processed in ${one.total_s} s`
    : `${done.length} images · ${esc(s.crs)} · processed in ${s.total_s} s`);

  $('perImageCard').classList.toggle('hidden', job.images.length < 2);
  $('perImage').innerHTML = job.images.map(im => {
    if (im.status !== 'done')
      return `<tr><td>${esc(im.name)}</td><td colspan="2" style="color:var(--err-ink)">${esc(im.error || im.status)}</td></tr>`;
    const st = im.stats;
    const len = Object.values(st.by_type).reduce((a, v) => a + v.length_m, 0);
    return `<tr><td>${esc(im.name)}<br><a href="${url(im.files.gpkg)}" download>GeoPackage</a></td>` +
           `<td class="num">${st.lines} lines<br>${Math.round(len).toLocaleString()} m</td>` +
           `<td class="num">${st.total_s} s</td></tr>`;
  }).join('');

  const dl = [['gpkg', 'GeoPackage'], ['shp', 'Shapefile (zip)'], ['geojson', 'GeoJSON'], ['stats', 'Stats (json)']];
  $('downloads').innerHTML = dl.filter(([k]) => job.files[k])
    .map(([k, label]) => `<a class="btn" href="${url(job.files[k])}" download>${label}</a>`).join('');
  $('dashLayer').classList.toggle('hidden', !s.by_type.dash);
  $('results').classList.remove('hidden');
}

document.querySelectorAll('[data-layer]').forEach(cb => cb.onchange = () => {
  const l = typeLayers[cb.dataset.layer]; if (!l) return;
  cb.checked ? l.addTo(map) : map.removeLayer(l);
});
$('photoToggle').onchange = e => e.target.checked ? photos.addTo(map) : map.removeLayer(photos);
$('opacity').oninput = e => photos.eachLayer(l => l.setOpacity(+e.target.value));
</script>
</body>
</html>
