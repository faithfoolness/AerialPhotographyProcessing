<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Markings</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235f8fa8'/%3E%3Cpath d='M11 6 7 26M21 6l4 20' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M16 7v4m0 5v4m0 5v1' stroke='%23ffd166' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<style>
  :root {
    --bg: #f6f7f8; --panel: #ffffff; --ink: #24303a; --muted: #7a8790; --faint: #a9b3ba;
    --line: #e7ebee; --soft: #f3f6f8; --accent: #5f8fa8; --accent-ink: #4a7891;
    --ok: #eaf3ee; --ok-line: #b9d6c4; --err: #fbeeee; --err-ink: #b0504f;
    --solid: #ff4d5e; --dashed: #ffb020;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 24px 22px;
          overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 28px; height: 28px; }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }

  .drop { border: 1.5px dashed #c9d4dc; border-radius: var(--radius); background: var(--soft);
          padding: 26px 16px 20px; text-align: center; cursor: pointer; transition: background .15s, border-color .15s; }
  .drop:hover, .drop.over { background: #ebf1f5; border-color: var(--accent); }
  .drop svg { color: var(--accent); }
  .drop-title { margin: 8px 0 2px; font-weight: 600; }
  .drop-hint { margin: 0; color: var(--muted); font-size: 13px; }
  .pick { margin-top: 12px; display: flex; justify-content: center; gap: 6px; color: var(--faint); }
  .link { appearance: none; border: 0; background: none; padding: 0; font: inherit; font-size: 13px;
          color: var(--accent-ink); cursor: pointer; font-weight: 500; }
  .link:hover { text-decoration: underline; }

  .filelist { list-style: none; margin: 8px 0 0; padding: 0; max-height: 210px; overflow-y: auto; }
  .filelist li { display: flex; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .filelist li:last-child { border-bottom: 0; }
  .filelist .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; color: var(--muted); background: var(--soft); border-radius: 4px; padding: 1px 6px; }
  .tag.missing { color: var(--err-ink); background: var(--err); }
  .remove { appearance: none; border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
  .remove:hover { color: var(--ink); }
  .note { font-size: 12px; color: var(--err-ink); margin: 6px 0 0; }

  details.settings summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; user-select: none; }
  details.settings summary::-webkit-details-marker { display: none; }
  details.settings summary::before { content: "›"; display: inline-block; width: 12px; transition: transform .15s; }
  details.settings[open] summary::before { transform: rotate(90deg); }
  .settings-body { padding: 10px 0 2px 12px; display: grid; gap: 12px; }
  .field { font-size: 12px; color: var(--muted); }
  .field input { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid var(--line);
                 border-radius: 8px; font: inherit; font-size: 13px; color: var(--ink); }
  .field input:focus { outline: 2px solid #cfe0ea; border-color: var(--accent); }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; }

  .primary { appearance: none; border: 0; border-radius: 10px; padding: 12px 16px; width: 100%; cursor: pointer;
             background: var(--accent); color: #fff; font: inherit; font-weight: 600; transition: background .15s;
             text-decoration: none; display: block; text-align: center; }
  .primary:hover { background: var(--accent-ink); }
  .primary:disabled { background: #cfd8de; cursor: default; }

  .progress { height: 4px; background: var(--soft); border-radius: 2px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .error { background: var(--err); color: var(--err-ink); padding: 10px 12px; border-radius: 10px; font-size: 13px; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .tile b { display: block; font-size: 22px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile span { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .meta { font-size: 12px; color: var(--muted); margin: 8px 2px 0; }
  .more { display: flex; justify-content: center; gap: 6px; color: var(--faint); margin-top: 8px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px;
          padding: 5px 11px; font-size: 13px; cursor: pointer; user-select: none; background: var(--panel); }
  .chip input { display: none; }
  .chip:has(input:not(:checked)) { color: var(--faint); background: var(--soft); }
  .chip:has(input:not(:checked)) .dot { opacity: .35; }

  details.images summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
  details.images summary::-webkit-details-marker { display: none; }
  details.images summary::before { content: "›"; display: inline-block; width: 12px; transition: transform .15s; }
  details.images[open] summary::before { transform: rotate(90deg); }
  .images ul { list-style: none; margin: 8px 0 0; padding: 0; }
  .images li { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .images li:last-child { border-bottom: 0; }
  .images .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .images .num { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .images .failed { color: var(--err-ink); }

  #map { height: 100%; background: #e9edf0; }
  .leaflet-popup-content { font-size: 13px; line-height: 1.5; }
  .hidden { display: none !important; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 70vh; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235f8fa8'/%3E%3Cpath d='M11 6 7 26M21 6l4 20' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M16 7v4m0 5v4m0 5v1' stroke='%23ffd166' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" alt="">
      <h1>Road Markings</h1>
    </header>

    <form id="form">
      <div class="drop" id="drop">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <p class="drop-title">Drop orthophotos or a folder</p>
        <p class="drop-hint">GeoTIFF, with .tfw / .prj if they have them</p>
        <div class="pick">
          <button type="button" class="link" id="pickFiles">Choose files</button>·<button type="button" class="link" id="pickFolder">Choose folder</button>
        </div>
      </div>
      <input type="file" id="fileInput" multiple accept=".tif,.tiff,.tfw,.tifw,.prj" hidden>
      <input type="file" id="folderInput" webkitdirectory multiple hidden>

      <ul class="filelist" id="fileList"></ul>
      <p class="note hidden" id="orphans"></p>

      <div style="height:14px"></div>
      <details class="settings">
        <summary>Settings</summary>
        <div class="settings-body">
          <label class="field">Coordinate system for images without one
            <input type="text" id="crs" placeholder="e.g. EPSG:32637" autocomplete="off">
          </label>
          <label class="check"><input type="checkbox" id="vehicles" checked> Ignore cars and trucks</label>
        </div>
      </details>
      <div style="height:14px"></div>
      <button type="submit" class="primary" id="go" disabled>Extract markings</button>
    </form>

    <div id="progressBox" class="hidden">
      <div class="progress"><div id="bar"></div></div>
      <div class="status" id="status"></div>
    </div>
    <div id="errorBox" class="error hidden"></div>

    <section id="results" class="hidden">
      <div class="tiles">
        <div class="tile"><b id="solidLen">0</b><span><i class="dot" style="background:var(--solid)"></i><span id="solidCount">Solid</span></span></div>
        <div class="tile"><b id="dashedLen">0</b><span><i class="dot" style="background:var(--dashed)"></i><span id="dashedCount">Dashed</span></span></div>
      </div>
      <p class="meta" id="meta"></p>

      <div style="height:14px"></div>
      <a class="primary" id="dlMain" download>Download GeoPackage</a>
      <div class="more" id="dlMore"></div>

      <div style="height:18px"></div>
      <div class="chips">
        <label class="chip"><input type="checkbox" data-layer="solid" checked><i class="dot" style="background:var(--solid)"></i>Solid</label>
        <label class="chip"><input type="checkbox" data-layer="dashed" checked><i class="dot" style="background:var(--dashed)"></i>Dashed</label>
        <label class="chip"><input type="checkbox" id="photoToggle" checked><i class="dot" style="background:#9aa7b0"></i>Photo</label>
      </div>

      <div style="height:16px"></div>
      <details class="images hidden" id="perImage">
        <summary id="perImageTitle">Images</summary>
        <ul id="perImageList"></ul>
      </details>
    </section>
  </aside>
  <div id="map"></div>
</div>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script>
const COLORS = { solid: '#ff4d5e', dashed: '#ffb020', dash: '#5aa9ff' };
const LABELS = { solid: 'Solid', dashed: 'Dashed', dash: 'Stroke' };
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtLen = m => m >= 1000 ? `${(m / 1000).toLocaleString(undefined, { maximumFractionDigits: 2 })} km` : `${Math.round(m)} m`;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const map = L.map('map', { zoomControl: true }).setView([55.75, 37.62], 5);
const imagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 22, maxNativeZoom: 19, attribution: 'Imagery © Esri' }).addTo(map);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 22, maxNativeZoom: 19, attribution: '© OpenStreetMap contributors' });
L.control.layers({ 'Satellite': imagery, 'Map': osm }, null, { position: 'topright' }).addTo(map);

// ---------- choosing files ----------
const ACCEPT = /\.(tif|tiff|tfw|tifw|prj)$/i;
const isTif = n => /\.tiff?$/i.test(n);
const stem = n => n.replace(/\.[^.]+$/, '').toLowerCase();
let files = new Map();

function add(list) {
  for (const f of list) if (ACCEPT.test(f.name)) files.set(f.name, f);
  render();
}

// a dropped folder arrives as a directory entry; walk it (and its subfolders)
async function filesFromDrop(dt) {
  const entries = [...dt.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!entries.some(e => e.isDirectory)) return [...dt.files];
  const out = [];
  const walk = async entry => {
    if (entry.isFile) { out.push(await new Promise((ok, no) => entry.file(ok, no))); return; }
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((ok, no) => reader.readEntries(ok, no));
      if (!batch.length) break;
      for (const e of batch) await walk(e);
    }
  };
  for (const e of entries) await walk(e);
  return out;
}

function render() {
  const all = [...files.values()];
  const tifs = all.filter(f => isTif(f.name)).sort((a, b) => a.name.localeCompare(b.name));
  const side = all.filter(f => !isTif(f.name));
  const companions = t => side.filter(c => stem(c.name) === stem(t.name) || tifs.length === 1);
  $('fileList').innerHTML = tifs.map(t => {
    const mine = companions(t);
    const tfw = mine.some(c => /\.(tfw|tifw)$/i.test(c.name));
    const prj = mine.some(c => /\.prj$/i.test(c.name));
    return `<li><span class="name" title="${esc(t.name)}">${esc(t.name)}</span>` +
      (tfw ? '<span class="tag">tfw</span>' : '') + (prj ? '<span class="tag">prj</span>' : '') +
      `<button type="button" class="remove" data-name="${esc(t.name)}" aria-label="Remove">×</button></li>`;
  }).join('');
  const orphans = tifs.length > 1 ? side.filter(c => !tifs.some(t => stem(t.name) === stem(c.name))) : [];
  $('orphans').textContent = orphans.length ? `No image found for ${orphans.map(o => o.name).join(', ')}` : '';
  $('orphans').classList.toggle('hidden', !orphans.length);
  $('go').disabled = tifs.length === 0;
  $('go').textContent = tifs.length > 1 ? `Extract markings · ${tifs.length} images` : 'Extract markings';
}

$('fileList').addEventListener('click', e => {
  const name = e.target.dataset && e.target.dataset.name;
  if (!name) return;
  for (const k of [...files.keys()]) if (k === name || stem(k) === stem(name)) files.delete(k);
  render();
});
// the inputs live outside the drop zone, so opening them cannot re-trigger the zone's click
$('drop').addEventListener('click', () => $('fileInput').click());
$('pickFiles').addEventListener('click', e => { e.stopPropagation(); $('fileInput').click(); });
$('pickFolder').addEventListener('click', e => { e.stopPropagation(); $('folderInput').click(); });
for (const id of ['fileInput', 'folderInput'])
  $(id).addEventListener('change', e => { add(e.target.files); e.target.value = ''; });
['dragenter', 'dragover'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', async e => add(await filesFromDrop(e.dataTransfer)));

// ---------- running ----------
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData();
  files.forEach(f => fd.append('files', f));
  fd.append('crs', $('crs').value);
  fd.append('vehicles', $('vehicles').checked);
  $('go').disabled = true;
  $('errorBox').classList.add('hidden');
  $('results').classList.add('hidden');
  $('progressBox').classList.remove('hidden');
  setProgress(0, 'Uploading…');
  try {
    const r = await fetch('/api/jobs', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Upload failed');
    poll(data.id);
  } catch (err) { fail(err.message); }
});

function setProgress(f, msg) { $('bar').style.width = (f * 100) + '%'; $('status').textContent = msg; }
function fail(msg) {
  $('progressBox').classList.add('hidden');
  $('errorBox').textContent = msg; $('errorBox').classList.remove('hidden');
  $('go').disabled = files.size === 0;
}

async function poll(id) {
  const job = await (await fetch(`/api/jobs/${id}`)).json();
  if (job.status === 'error') return fail(job.error);
  const n = job.images.length;
  const step = job.message.split(': ').pop();
  setProgress(job.progress, n > 1 ? `${Math.min(job.current + 1, n)} of ${n} · ${step}` : step);
  if (job.status !== 'done') return setTimeout(() => poll(id), 700);
  $('progressBox').classList.add('hidden');
  $('go').disabled = false;
  show(id, job);
}

// ---------- results ----------
let photos = L.layerGroup().addTo(map), typeLayers = {};

async function show(id, job) {
  const url = name => `/api/jobs/${id}/files/` + name.split('/').map(encodeURIComponent).join('/');
  const done = job.images.filter(im => im.status === 'done');
  const [geo, ...prevs] = await Promise.all([
    fetch(url(job.files.geojson)).then(r => r.json()),
    ...done.map(im => fetch(url(im.files.preview_bounds)).then(r => r.json())),
  ]);

  photos.clearLayers();
  Object.values(typeLayers).forEach(l => map.removeLayer(l));
  let bounds = null;
  done.forEach((im, i) => {
    photos.addLayer(L.imageOverlay(url(im.files.preview), prevs[i].bounds, { opacity: .92 }));
    const b = L.latLngBounds(prevs[i].bounds);
    bounds = bounds ? bounds.extend(b) : b;
  });
  typeLayers = {};
  for (const t of Object.keys(COLORS)) {
    typeLayers[t] = L.geoJSON(geo, {
      filter: f => f.properties.type === t,
      style: { color: COLORS[t], weight: 2.5, opacity: .95, dashArray: t === 'dashed' ? '6 5' : null },
      onEachFeature: (f, l) => {
        const p = f.properties;
        l.bindPopup(`<b>${LABELS[p.type]}</b> · ${esc(p.color)}<br>${fmtLen(p.length_m)}` +
                    (done.length > 1 ? `<br><span style="color:#7a8790">${esc(p.image)}</span>` : ''));
      },
    }).addTo(map);
  }
  document.querySelectorAll('[data-layer]').forEach(cb => cb.checked = true);
  $('photoToggle').checked = true;
  photos.addTo(map);
  if (bounds) map.fitBounds(bounds, { padding: [20, 20] });

  const s = job.stats, bt = s.by_type || {};
  for (const t of ['solid', 'dashed']) {
    const v = bt[t] || { count: 0, length_m: 0 };
    $(`${t}Len`).textContent = fmtLen(v.length_m);
    $(`${t}Count`).textContent = `${LABELS[t]} · ${v.count}`;
  }
  const failed = job.images.length - done.length;
  $('meta').textContent = [done.length > 1 ? plural(done.length, 'image') : null, `${s.total_s} s`,
                           failed ? `${failed} failed` : null].filter(Boolean).join(' · ');

  $('dlMain').href = url(job.files.gpkg);
  $('dlMore').innerHTML = [['shp', 'Shapefile'], ['geojson', 'GeoJSON']].filter(([k]) => job.files[k])
    .map(([k, label]) => `<a class="link" href="${url(job.files[k])}" download>${label}</a>`).join('·');

  $('perImage').classList.toggle('hidden', job.images.length < 2);
  $('perImage').open = failed > 0;
  $('perImageTitle').textContent = `Images (${job.images.length})`;
  $('perImageList').innerHTML = job.images.map(im => {
    if (im.status !== 'done')
      return `<li><span class="name">${esc(im.name)}</span><span class="failed" title="${esc(im.error || '')}">failed</span></li>`;
    const len = Object.values(im.stats.by_type).reduce((a, v) => a + v.length_m, 0);
    return `<li><a class="link name" href="${url(im.files.gpkg)}" download title="Download GeoPackage">${esc(im.name)}</a>` +
           `<span class="num">${fmtLen(len)}</span></li>`;
  }).join('');
  $('results').classList.remove('hidden');
}

document.querySelectorAll('[data-layer]').forEach(cb => cb.addEventListener('change', () => {
  const l = typeLayers[cb.dataset.layer]; if (!l) return;
  cb.checked ? l.addTo(map) : map.removeLayer(l);
}));
$('photoToggle').addEventListener('change', e => e.target.checked ? photos.addTo(map) : map.removeLayer(photos));
</script>
</body>
</html>
